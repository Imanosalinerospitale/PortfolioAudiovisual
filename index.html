<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imanol Salinero Spitale - Producción Audiovisual y Diseño Gráfico</title>
  <meta name="description" content="Productor audiovisual con más de 10 años de experiencia en cine, publicidad y videoclips. Córdoba, Argentina." />
  <meta property="og:title" content="Imanol Salinero Spitale - Producción Audiovisual y Diseño Gráfico" />
  <meta property="og:description" content="Más de 10 años de experiencia en desarrollo, gestión y logística de proyectos de cine, videoclips y publicidad." />
  <meta property="og:image" content="https://imanolsalinerospitale.com/img/linkedingraph.jpg?v=2" />
  <meta property="og:url" content="https://imanolsalinerospitale.com/" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="img/bloque.png?v=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body data-page="home">

  <div id="site-header"></div>
  <script src="site.js"></script>

  <main>
    <!-- HERO -->
    <section id="inicio" class="hero wrap">
      <h1 class="font-martian">Imanol Salinero Spitale <span data-key="hero_role">Productor Audiovisual</span></h1>
      <p class="hero-tag" data-key="hero_tag">10 años produciendo cine, publicidad y videoclips</p>
      <div class="hero-actions">
        <a href="reel.html" class="btn btn-solid" data-key="btn_reel">Ver reel</a>
        <a href="#contacto" class="btn btn-ghost" data-key="btn_contact">Contactame</a>
      </div>
    </section>

    <!-- CINE -->
    <section id="cine" class="wrap block-section">
      <h2 class="sec-title font-martian" data-key="sec_cine">CINE</h2>
      <div id="grid-cine" class="max-w-6xl mx-auto space-y-6"></div>
    </section>

    <!-- PUBLICIDAD -->
    <section id="publicidad" class="wrap block-section">
      <h2 class="sec-title font-martian" data-key="sec_pub">PUBLICIDAD</h2>
      <div id="grid-pub" class="max-w-6xl mx-auto space-y-6"></div>
    </section>

    <!-- VIDEOCLIPS -->
    <section id="videoclips" class="wrap block-section">
      <h2 class="sec-title font-martian" data-key="sec_video">VIDEOCLIPS</h2>
      <div id="grid-video" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto"></div>
    </section>

    <!-- DISEÑO GRÁFICO -->
    <section id="diseno" class="wrap block-section">
      <h2 class="sec-title font-martian" data-key="sec_diseno">DISEÑO GRÁFICO</h2>
      <div class="marquee">
        <div class="marquee-track slide-loop">
          <img src="img/diseño1.jpg" alt="Trabajos de diseño gráfico" />
          <img src="img/diseño1.jpg" alt="" aria-hidden="true" />
        </div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section id="contacto" class="wrap block-section">
      <h2 class="sec-title font-martian" data-key="sec_contact">CONTACTO</h2>
      <div class="contact-grid">
        <form id="contact-form" class="contact-form" action="https://formsubmit.co/ajax/imanolnet@gmail.com" method="POST">
          <label class="field"><span data-key="f_name">Nombre</span>
            <input type="text" name="name" required autocomplete="name" /></label>
          <label class="field"><span data-key="f_email">Email</span>
            <input type="email" name="email" required autocomplete="email" /></label>
          <label class="field"><span data-key="f_msg">Mensaje</span>
            <textarea name="message" rows="5" required></textarea></label>
          <!-- anti-spam: campo oculto + configuración de FormSubmit -->
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_subject" value="Nuevo mensaje desde imanolsalinerospitale.com" />
          <button type="submit" class="btn btn-solid" data-key="f_send">Enviar mensaje</button>
          <p id="form-msg" class="form-msg" role="status" aria-live="polite"></p>
        </form>
        <div class="contact-direct">
          <p><a href="mailto:imanolnet@gmail.com">imanolnet@gmail.com</a></p>
          <p><a href="https://wa.me/543516074183" target="_blank" rel="noopener">WhatsApp</a></p>
          <p>Córdoba, Argentina</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="main.js"></script>
</body>
</html>
