<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta property="og:title" content="Imanol Salinero Spitale - Fotografía" />
  <meta property="og:description" content="Portfolio fotográfico de Imanol Salinero Spitale - Producción Audiovisual y Dirección de Fotografía." />
  <meta property="og:image" content="https://imanolsalinerospitale.com/img/linkedingraph.jpg?v=2" />
  <meta property="og:url" content="https://imanolsalinerospitale.com/fotografias.html" />
  <meta property="og:type" content="website" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imanol Salinero Spitale - Fotografía</title>
  <link rel="icon" type="image/png" href="img/bloque.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-martian { font-family: 'Oswald', sans-serif; letter-spacing: 0.05em; }
    .lang-btn.active { text-decoration: underline; font-weight: bold; color: #000; }
    .lang-btn { color: #666; transition: all 0.3s; }
  </style>
</head>
<body class="bg-white text-black px-4 sm:px-8">

  <!-- HEADER NAV -->
  <header class="flex justify-between items-center py-3 text-sm">
    <nav class="space-x-6">
      <a href="index.html#inicio" class="hover:underline" data-key="nav_inicio">inicio</a>
      <a href="fotografias.html" class="hover:underline font-bold" data-key="nav_foto">fotografía</a>
      <a href="https://drive.google.com/file/d/1mj4kHYrMsSkVju7X1PdJfNrze0NyiQni/view?usp=sharing" target="_blank" class="hover:underline" data-key="nav_reel">reel</a>
      <a id="nav-cv-link" href="CV - Imanol Salinero Spitale.pdf" data-pdf-es="CV - Imanol Salinero Spitale.pdf" data-pdf-en="CV - Imanol Salinero Spitale - English.pdf" target="_blank" class="hover:underline" data-key="nav_cv">cv</a>
    </nav>
    <div class="flex space-x-2 items-center border-l pl-4 border-gray-300">
      <button onclick="changeLanguage('es')" id="btn-es" class="lang-btn active">ES</button>
      <span class="text-gray-300">|</span>
      <button onclick="changeLanguage('en')" id="btn-en" class="lang-btn">EN</button>
    </div>
  </header>

  <!-- TITULO SECCIÓN -->
  <section class="text-center my-6 sm:my-8">
    <h1 class="text-5xl sm:text-6xl font-bold font-martian" data-key="title_foto">FOTOGRAFÍA</h1>
  </section>

  <!-- GALERÍA ESTILO MASONRY (TETRIS ORGÁNICO CON ORDEN ALEATORIO) -->
  <section class="max-w-7xl mx-auto my-6">
    <div id="gallery-container" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-4 space-y-4">
      <!-- Las imágenes se acomodan dinámicamente -->
    </div>
  </section>

  <hr class="border-t border-gray-300 my-8" />

  <!-- FOOTER -->
  <footer class="text-center mt-12 mb-8">
    <h2 class="text-lg font-semibold mb-4" data-key="socials">Redes Sociales</h2>
    <div class="flex justify-center space-x-6">
      <a href="https://www.imdb.com/name/nm16288616/" target="_blank" title="IMDb"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/imdb.svg" alt="IMDb" class="w-8 h-8 hover:opacity-75"></a>
      <a href="https://www.linkedin.com/in/imanol-salinero-spitale/" target="_blank" title="LinkedIn"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn" class="w-8 h-8 hover:opacity-75"></a>
      <a href="https://wa.me/543516074183" target="_blank" title="WhatsApp"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp" class="w-8 h-8 hover:opacity-75"></a>
    </div>
  </footer>

  <!-- LIGHTBOX / VISOR PANTALLA COMPLETA -->
  <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-95 hidden z-50 flex items-center justify-center p-4 select-none">
    <button onclick="closeLightbox()" class="absolute top-4 right-6 text-white text-4xl font-bold hover:text-gray-400 focus:outline-none">&times;</button>
    <button onclick="prevImage()" class="absolute left-4 text-white text-5xl font-bold hover:text-gray-400 focus:outline-none p-2">&lsaquo;</button>
    <img id="lightbox-img" src="" alt="Fotografía en tamaño completo" class="max-h-[90vh] max-w-[90vw] object-contain rounded shadow-2xl" />
    <button onclick="nextImage()" class="absolute right-4 text-white text-5xl font-bold hover:text-gray-400 focus:outline-none p-2">&rsaquo;</button>
  </div>

  <script>
    const TOTAL_FOTOS = 159; 
    
    // Generamos las rutas de las fotos
    let photos = Array.from({ length: TOTAL_FOTOS }, (_, i) => {
      const fileName = `Analógica (${i + 1}).webp`;
      return `Analógicas/${encodeURIComponent(fileName)}`;
    });

    // ALGORITMO PARA MEZCLAR LAS FOTOS ALEATORIAMENTE (Fisher-Yates)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    let currentPhotoIndex = 0;

    // RENDERIZAR GALERÍA MEZCLADA
    function renderGallery() {
      // Mezclamos el array antes de dibujarlo en pantalla
      shuffleArray(photos);

      const container = document.getElementById('gallery-container');
      container.innerHTML = photos.map((src, index) => `
        <div id="photo-card-${index}" class="break-inside-avoid overflow-hidden rounded shadow bg-gray-100 cursor-pointer group mb-4" onclick="openLightbox(${index})">
          <img src="${src}" loading="lazy" alt="Fotografía" class="w-full h-auto object-cover transition-transform duration-300 group-hover:scale-105" onerror="document.getElementById('photo-card-${index}').remove();" />
        </div>
      `).join('');
    }

    // CONTROL DEL LIGHTBOX
    function openLightbox(index) {
      currentPhotoIndex = index;
      document.getElementById('lightbox-img').src = photos[currentPhotoIndex];
      document.getElementById('lightbox').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    function prevImage() {
      currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
      document.getElementById('lightbox-img').src = photos[currentPhotoIndex];
    }

    function nextImage() {
      currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
      document.getElementById('lightbox-img').src = photos[currentPhotoIndex];
    }

    // TECLAS FLECHAS Y ESCAPE
    document.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
      }
    });

    // DICCIONARIO TRADUCCIONES
    const translations = {
      es: {
        nav_inicio: "inicio", nav_foto: "fotografía", nav_reel: "reel", nav_cv: "cv",
        title_foto: "FOTOGRAFÍA", socials: "Redes Sociales"
      },
      en: {
        nav_inicio: "home", nav_foto: "photography", nav_reel: "reel", nav_cv: "resume",
        title_foto: "PHOTOGRAPHY", socials: "Social Media"
      }
    };

    // INICIALIZACIÓN
    window.onload = () => {
      renderGallery();
      const savedLang = localStorage.getItem('preferredLang') || 'es';
      changeLanguage(savedLang);
    };

    // CAMBIO DE IDIOMA Y PDF DINÁMICO
    function changeLanguage(lang) {
      localStorage.setItem('preferredLang', lang);
      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (translations[lang][key]) { el.innerText = translations[lang][key]; }
      });

      const cvLink = document.getElementById('nav-cv-link');
      if (cvLink) {
        cvLink.href = cvLink.getAttribute(`data-pdf-${lang}`);
      }

      document.getElementById('btn-es').classList.toggle('active', lang === 'es');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.documentElement.lang = lang;
    }
  </script>
</body>
</html>
