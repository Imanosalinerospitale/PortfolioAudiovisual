<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto - Imanol Salinero Spitale</title>
  <meta name="description" content="Contacto de Imanol Salinero Spitale, productor audiovisual en Córdoba, Argentina." />
  <meta property="og:title" content="Contacto - Imanol Salinero Spitale" />
  <meta property="og:description" content="Contacto de Imanol Salinero Spitale, productor audiovisual en Córdoba, Argentina." />
  <meta property="og:image" content="https://imanolsalinerospitale.com/img/linkedingraph.jpg?v=2" />
  <meta property="og:url" content="https://imanolsalinerospitale.com/contacto.html" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="img/bloque.png?v=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body data-page="contacto">
  <div id="site-header"></div>
  <script src="site.js"></script>

  <main class="wrap page-main">
    <h1 class="sec-title font-martian" data-key="sec_contact">CONTACTO</h1>
    <div class="contact-grid">
      <form id="contact-form" class="contact-form" action="https://formsubmit.co/ajax/imanolnet@gmail.com" method="POST">
        <label class="field"><span data-key="f_name">Nombre</span>
          <input type="text" name="name" required autocomplete="name" /></label>
        <label class="field"><span data-key="f_email">Email</span>
          <input type="email" name="email" required autocomplete="email" /></label>
        <label class="field"><span data-key="f_msg">Mensaje</span>
          <textarea name="message" rows="5" required></textarea></label>
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_subject" value="Nuevo mensaje desde imanolsalinerospitale.com" />
        <button type="submit" class="btn btn-solid" data-key="f_send">Enviar mensaje</button>
        <p id="form-msg" class="form-msg" role="status" aria-live="polite"></p>
      </form>
      <div class="contact-direct">
        <p><a href="mailto:imanolnet@gmail.com">imanolnet@gmail.com</a></p>
        <p><a href="https://wa.me/543516074183" target="_blank" rel="noopener">WhatsApp</a></p>
        <p>Córdoba, Argentina</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script>
    addTranslations(
      { sec_contact:"CONTACTO", f_name:"Nombre", f_email:"Email", f_msg:"Mensaje", f_send:"Enviar mensaje", f_ok:"¡Gracias! Tu mensaje fue enviado.", f_err:"No se pudo enviar. Probá de nuevo o escribime a imanolnet@gmail.com", f_sending:"Enviando…" },
      { sec_contact:"CONTACT", f_name:"Name", f_email:"Email", f_msg:"Message", f_send:"Send message", f_ok:"Thank you! Your message was sent.", f_err:"Could not send. Please try again or write to imanolnet@gmail.com", f_sending:"Sending…" }
    );
// ================= FORMULARIO =================
function initForm() {
  const form = document.getElementById('contact-form');
  const msg = document.getElementById('form-msg');
  const t = k => translations[document.documentElement.lang][k];
  form.addEventListener('submit', async e => {
    e.preventDefault();
    msg.textContent = t('f_sending');
    try {
      const res = await fetch(form.action, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
      if (!res.ok) throw new Error();
      form.reset();
      msg.textContent = t('f_ok');
    } catch (err) { msg.textContent = t('f_err'); }
  });
}

    window.onload = () => { initForm(); initSite(); };
  </script>
</body>
</html>
